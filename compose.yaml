services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_DB: knowledgedesk
      POSTGRES_USER: kd_bootstrap
      POSTGRES_PASSWORD: ${KD_DB_PASSWORD:-local-bootstrap-only}
      KD_APP_PASSWORD: ${KD_APP_PASSWORD:-local-app-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd_bootstrap -d knowledgedesk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      KD_DATABASE_URL: postgresql+psycopg://knowledgedesk:${KD_APP_PASSWORD:-local-app-only}@db:5432/knowledgedesk
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    environment:
      KD_DATABASE_URL: postgresql+psycopg://knowledgedesk:${KD_APP_PASSWORD:-local-app-only}@db:5432/knowledgedesk
      KD_ENVIRONMENT: ${KD_ENVIRONMENT:-local}
      KD_MODE: ${KD_MODE:-search}
      KD_SECRET_KEY: ${KD_SECRET_KEY:-}
      KD_SECURE_COOKIES: ${KD_SECURE_COOKIES:-false}
      KD_OLLAMA_URL: ${KD_OLLAMA_URL:-http://host.docker.internal:11434}
      KD_EMBEDDING_MODEL: ${KD_EMBEDDING_MODEL:-}
      KD_GENERATION_MODEL: ${KD_GENERATION_MODEL:-}
      KD_EMBEDDING_DIMENSIONS: ${KD_EMBEDDING_DIMENSIONS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document-data:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "knowledgedesk.workers.ingest"]
    environment:
      KD_DATABASE_URL: postgresql+psycopg://knowledgedesk:${KD_APP_PASSWORD:-local-app-only}@db:5432/knowledgedesk
      KD_MODE: ${KD_MODE:-search}
      KD_STORAGE_ROOT: /app/data/private
      KD_OLLAMA_URL: ${KD_OLLAMA_URL:-http://host.docker.internal:11434}
      KD_EMBEDDING_MODEL: ${KD_EMBEDDING_MODEL:-}
      KD_EMBEDDING_DIMENSIONS: ${KD_EMBEDDING_DIMENSIONS:-}
    volumes:
      - document-data:/app/data/private
    mem_limit: 1500m
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    profiles: ["models"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-model-data:/root/.ollama
    mem_limit: 2g
    cpus: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  document-data:
  ollama-model-data:
    name: knowledgedesk-ollama-models
