name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: knowledgedesk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledgedesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KD_DATABASE_URL: postgresql+psycopg://postgres:integration-only@127.0.0.1:5432/knowledgedesk_test
      KD_TEST_DATABASE_URL: postgresql+psycopg://postgres:integration-only@127.0.0.1:5432/knowledgedesk_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.22
          uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Verify migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -ra --basetemp=.test-tmp -p no:cacheprovider
      - name: Verify generated demo assets
        run: |
          uv run python scripts/generate_demo_assets.py
          git diff --exit-code -- evals/datasets demo/corpus/manifest.json 'demo/corpus/*.md'
