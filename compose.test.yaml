services:
  test-db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_DB: knowledgedesk_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgedesk_test"]
      interval: 2s
      timeout: 2s
      retries: 30
