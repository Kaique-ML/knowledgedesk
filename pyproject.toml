[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledgedesk"
version = "0.1.0"
description = "A source-grounded corporate knowledge desk with explicit access boundaries."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<0.143",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "sqlalchemy>=2.0.40,<2.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "playwright>=1.55,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["fitz.*", "openpyxl.*", "pytesseract.*"]
ignore_missing_imports = true
